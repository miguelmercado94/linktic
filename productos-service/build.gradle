plugins {
	id 'java'
	id 'org.springframework.boot' version '3.1.5'
	id 'io.spring.dependency-management' version '1.1.3'
	id 'com.github.johnrengelman.processes' version '0.5.0'
	id 'org.sonarqube' version '4.4.1.3373'
	id 'jacoco'
}

group = 'com.linktic.test.miguelmercado'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

ext {
	mapstructVersion = '1.5.5.Final'
	openApiVersion = '2.2.0'
	mockitoVersion = '5.5.0'
	r2dbcPostgresVersion = '1.0.7.RELEASE'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'

	implementation "org.postgresql:r2dbc-postgresql:${r2dbcPostgresVersion}"
	runtimeOnly 'org.postgresql:postgresql'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	implementation "org.mapstruct:mapstruct:${mapstructVersion}"
	annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	implementation "org.springdoc:springdoc-openapi-starter-webflux-ui:${openApiVersion}"

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testImplementation "org.mockito:mockito-core:${mockitoVersion}"
	testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

tasks.named('test') {
	useJUnitPlatform()
}

jacoco {
	toolVersion = "0.8.11"
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
	afterEvaluate {
		classDirectories.setFrom(
				files(classDirectories.files.collect {
					fileTree(dir: it, exclude: [
							'**/dto/**',
							'**/model/**',
							'**/*Dto.*',
							'**/*Request.*',
							'**/*Response.*',
							'**/ApiError.*',
							'**/ErrorCode.*',
							'**/GlobalExceptionHandler.*',
							'**/SwaggerConfig.*',
							'**/ProductosServiceApplication.*'
					])
				})
		)
	}
}


